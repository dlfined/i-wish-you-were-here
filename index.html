<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>once in a lifetime</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    
    <img id="arg-image" alt="Loading data...">

    <script>
       
        const normalImage = "HobbyTown_USA_Oshkosh_interior_under_construction_2002_(The_Backrooms).jpg";
        const rareImage = "sctvmqpnr1b51.jpeg";

        
        
        const rareImageChance = 0.20; 

        
        const imgElement = document.getElementById("arg-image");
        
        if (Math.random() < rareImageChance) {
            imgElement.src = rareImage;
            console.log("I lost you.");
        } else {
            imgElement.src = normalImage;
        }
    </script>

</body>
</html>
