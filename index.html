<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>once in a lifetime</title> <!-- Change your website browser tab title here -->
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <!-- The image starts empty; JavaScript will choose the file dynamically -->
    <img id="arg-image" alt="Loading data...">

    <script>
        // 1. Type the exact names of your two uploaded image files here
        const normalImage = "your-default-image.png";
        const rareImage = "sctvmqpnr1b51.jpeg";

        // 2. Define the spawn chance of the second image (from 0 to 1)
        // 0.20 means a 20% chance. 0.05 would be a 5% chance.
        const rareImageChance = 0.20; 

        // The system rolls a random number and selects the image
        const imgElement = document.getElementById("arg-image");
        
        if (Math.random() < rareImageChance) {
            imgElement.src = rareImage;
            console.log("Anomaly detected in system logs."); // Secret message hidden in the browser console
        } else {
            imgElement.src = normalImage;
        }
    </script>

</body>
</html>
